<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCTV นครศรีธรรมราช + เรดาร์</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

<style>
* { font-family: 'Kanit', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0b1120; }
#map { height: 100vh; width: 100%; z-index: 1; }

/* ============================================================
   SIDEBAR — ★ เพิ่ม transition + collapse state ★
   ============================================================ */
.test-sidebar {
    position: absolute; top: 12px; left: 12px;
    width: 340px;
    max-height: calc(100vh - 24px);
    z-index: 900;
    background: rgba(15,23,42,0.94); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.55);
    transition: transform .35s cubic-bezier(0.16, 1, 0.3, 1),
                opacity .25s ease,
                max-height .3s ease;
    transform: translateX(0);
    opacity: 1;
}

/* ★ สถานะยุบ — เลื่อนออกซ้าย + จางลง */
.test-sidebar.collapsed {
    transform: translateX(-380px);
    opacity: 0;
    pointer-events: none;
}

/* ============================================================
   ★★★ ปุ่มเปิด Sidebar กลับมา (แสดงเฉพาะตอนยุบ) ★★★
   ============================================================ */
.sidebar-reveal-btn {
    position: absolute; top: 12px; left: 12px;
    z-index: 899;
    width: 46px; height: 46px;
    background: linear-gradient(135deg, rgba(243,156,18,0.95), rgba(230,126,34,0.9));
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 12px;
    color: #fff; font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(243,156,18,0.45);
    backdrop-filter: blur(10px);
    opacity: 0;
    transform: translateX(-60px);
    pointer-events: none;
    transition: opacity .25s ease,
                transform .35s cubic-bezier(0.16, 1, 0.3, 1),
                background .2s,
                box-shadow .2s;
}
.sidebar-reveal-btn.show {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
}
.sidebar-reveal-btn:hover {
    background: linear-gradient(135deg, #f59e0b, #ea580c);
    box-shadow: 0 10px 30px rgba(243,156,18,0.65);
    transform: translateX(0) scale(1.06);
}
.sidebar-reveal-btn .reveal-tooltip {
    position: absolute; top: 50%; left: calc(100% + 10px);
    transform: translateY(-50%);
    background: rgba(0,0,0,0.92); color: #fff;
    font-size: .72rem; font-weight: 600;
    padding: 5px 10px; border-radius: 6px;
    white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity .18s;
    border: 1px solid rgba(255,255,255,0.1);
}
.sidebar-reveal-btn:hover .reveal-tooltip { opacity: 1; }

/* ============================================================
   การ์ดวันเวลาไทย + ปุ่ม ThaiWater
   ============================================================ */
.thai-datetime-card {
    padding: 14px 16px;
    background: linear-gradient(135deg, rgba(243,156,18,0.22), rgba(230,126,34,0.12));
    border-bottom: 1px solid rgba(243,156,18,0.28);
    display: flex; flex-direction: column; gap: 5px;
    flex-shrink: 0; position: relative; overflow: hidden;
}
.thai-datetime-card::before {
    content: ''; position: absolute; top: -50%; right: -30%;
    width: 150px; height: 150px;
    background: radial-gradient(circle, rgba(243,156,18,0.25), transparent 70%);
    pointer-events: none;
}
.thai-datetime-card .dt-day {
    display: flex; align-items: center; gap: 8px;
    color: #fcd34d; font-size: .78rem; font-weight: 500;
    position: relative; z-index: 1;
}
.thai-datetime-card .dt-day i { color: #f59e0b; font-size: .82rem; }
.thai-datetime-card .dt-time {
    display: flex; align-items: center; gap: 10px;
    color: #fff; font-size: 1.45rem; font-weight: 700;
    font-family: 'Courier New', monospace; letter-spacing: 1.5px;
    text-shadow: 0 0 14px rgba(243,156,18,0.45);
    position: relative; z-index: 1;
}
.thai-datetime-card .dt-time i { color: #f59e0b; font-size: 1.05rem; }

/* ThaiWater button */
.thaiwater-btn {
    position: absolute; top: 12px; right: 56px;  /* ★ ขยับซ้ายเพื่อหลบปุ่มยุบ */
    z-index: 2;
    width: 42px; height: 42px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all .2s ease;
    backdrop-filter: blur(6px);
    text-decoration: none;
}
.thaiwater-btn:hover {
    background: rgba(255,255,255,0.22);
    transform: scale(1.08);
    box-shadow: 0 4px 15px rgba(243,156,18,0.4);
}
.thaiwater-btn img {
    width: 30px; height: 30px;
    object-fit: contain;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.4));
}
.thaiwater-btn .tw-tooltip {
    position: absolute; bottom: -32px; right: 0;
    background: rgba(0,0,0,0.92);
    color: #fff; font-size: .68rem; font-weight: 600;
    padding: 4px 10px; border-radius: 6px;
    white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity .18s;
    border: 1px solid rgba(255,255,255,0.1);
}
.thaiwater-btn:hover .tw-tooltip { opacity: 1; }

/* ★★★ ปุ่มยุบ Sidebar — อยู่มุมขวาบนของการ์ด ★★★ */
.sidebar-collapse-btn {
    position: absolute; top: 12px; right: 12px;
    z-index: 3;
    width: 42px; height: 42px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    color: #fff; font-size: .95rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
    backdrop-filter: blur(6px);
}
.sidebar-collapse-btn:hover {
    background: rgba(0,0,0,0.7);
    transform: scale(1.08);
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}
.sidebar-collapse-btn .collapse-tooltip {
    position: absolute; top: 50%; right: calc(100% + 10px);
    transform: translateY(-50%);
    background: rgba(0,0,0,0.92); color: #fff;
    font-size: .68rem; font-weight: 600;
    padding: 4px 10px; border-radius: 6px;
    white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity .18s;
    border: 1px solid rgba(255,255,255,0.1);
}
.sidebar-collapse-btn:hover .collapse-tooltip { opacity: 1; }

/* ============================================================
   Search
   ============================================================ */
.sidebar-head {
    padding: 10px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.02);
    flex-shrink: 0;
}
.sidebar-head input {
    width: 100%; padding: 8px 12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    color: #fff; outline: none; font-size: .82rem;
    transition: border-color .2s;
}
.sidebar-head input:focus { border-color: #6366f1; }
.sidebar-head input::placeholder { color: #64748b; }

/* ============================================================
   Sections
   ============================================================ */
.sidebar-section {
    display: flex; flex-direction: column;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    overflow: hidden; flex-shrink: 0;
}
.sidebar-section.grow { min-height: 0; }
.sidebar-section .section-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 14px; background: rgba(255,255,255,0.04);
    border: 0; color: #cbd5e1;
    font-size: .74rem; font-weight: 600;
    cursor: pointer; font-family: inherit; text-align: left;
    transition: background .15s; flex-shrink: 0;
}
.sidebar-section .section-head:hover { background: rgba(99,102,241,0.18); color: #fff; }
.sidebar-section .section-head span { display: flex; align-items: center; gap: 7px; }
.sidebar-section .section-head .section-arrow {
    transition: transform .25s; font-size: .6rem; opacity: .65;
}
.sidebar-section.collapsed .section-arrow { transform: rotate(-90deg); }

.section-body {
    overflow-y: auto;
    transition: max-height .3s ease, opacity .2s ease;
    max-height: 2000px; opacity: 1;
}
.sidebar-section.collapsed .section-body {
    max-height: 0 !important; opacity: 0; overflow: hidden;
}
#section-camlist .section-body {
    max-height: calc(100vh - 380px);
    min-height: 0;
    overflow-y: auto;
}
.section-body::-webkit-scrollbar { width: 5px; }
.section-body::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
.section-body::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }

.legend-list {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    padding: 8px 12px 10px;
}
.legend-item {
    display: flex; align-items: center; gap: 6px;
    font-size: .68rem; color: #cbd5e1; cursor: pointer;
    padding: 4px 6px; border-radius: 6px;
    transition: background .15s;
}
.legend-item:hover { background: rgba(255,255,255,0.08); }
.legend-item.off { opacity: 0.35; }
.legend-dot {
    width: 9px; height: 9px; border-radius: 50%;
    border: 1.5px solid #fff; flex-shrink: 0;
}
.legend-item .cnt {
    margin-left: auto; color: #64748b;
    font-size: .6rem; font-family: 'Courier New', monospace;
}

#camera-list { padding: 6px 8px 10px; }
.cam-row {
    padding: 7px 10px; border-radius: 8px; cursor: pointer;
    margin-bottom: 3px; border-left: 3px solid transparent;
    background: rgba(255,255,255,0.03);
    transition: all .15s;
}
.cam-row:hover {
    background: rgba(99,102,241,0.15);
    border-left-color: #6366f1; transform: translateX(3px);
}
.cam-row.active {
    background: rgba(99,102,241,0.28);
    border-left-color: #6366f1;
    box-shadow: 0 2px 8px rgba(99,102,241,0.3);
}
.cam-row .name { color: #fff; font-size: .76rem; font-weight: 500; }
.cam-row .coords {
    font-family: 'Courier New', monospace;
    font-size: .66rem; color: #00ffcc; margin-top: 2px;
}

/* ============================================================
   POPUP
   ============================================================ */
.pixel-popup .leaflet-popup-content-wrapper {
    background: #0f172a; color: #fff; border-radius: 14px;
    padding: 0; border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 12px 30px rgba(0,0,0,0.6); overflow: hidden;
}
.pixel-popup .leaflet-popup-content { margin: 0; width: 360px !important; }
.pixel-popup .leaflet-popup-tip { background: #0f172a; }

.pp-head {
    padding: 10px 12px; font-weight: 700; font-size: .85rem;
    display: flex; align-items: center; gap: 6px;
}
.pp-media {
    background: #000; position: relative;
    aspect-ratio: 16/9; overflow: hidden;
}
.pp-media video, .pp-media img, .pp-media iframe {
    width: 100%; height: 100%; object-fit: cover;
    border: 0; display: block; background: #000;
}
.pp-media .badge-live {
    position: absolute; top: 8px; left: 8px; z-index: 2;
    background: rgba(220,53,69,0.92); color: #fff;
    font-size: .62rem; font-weight: 700; padding: 3px 8px; border-radius: 20px;
    display: flex; align-items: center; gap: 4px;
}
.pp-media .badge-live .dot {
    width: 6px; height: 6px; background:#fff; border-radius:50%;
    animation: pulseLive 1.4s infinite;
}
@keyframes pulseLive { 0%,100%{opacity:1;} 50%{opacity:.35;} }
.pp-media .badge-type {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    background: rgba(0,0,0,0.7); color: #00ffcc;
    font-size: .6rem; font-weight: 700; padding: 3px 8px; border-radius: 20px;
    border: 1px solid rgba(0,255,204,0.3);
}
.pp-media .loader {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #000; z-index: 1; color: #666; font-size: .75rem;
    flex-direction: column; gap: 8px;
}
.pp-media .loader .spinner {
    width: 30px; height: 30px; border: 3px solid #334155; border-top-color: #6366f1;
    border-radius: 50%; animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.pp-media .error-box {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: #1a1a1a; z-index: 2; color: #ffb3b3; font-size: .7rem;
    flex-direction: column; gap: 6px; padding: 12px; text-align: center; line-height: 1.5;
}
.pp-media .error-box i { font-size: 1.4rem; color: #e57373; }
.pp-media .error-box .fixbtn {
    margin-top: 4px; padding: 4px 12px; background: #4f46e5; color: #fff;
    border: 0; border-radius: 15px; font-size: .65rem; font-weight: 700;
    cursor: pointer; text-decoration: none;
}
.pp-media video::-webkit-media-controls-panel {
    background-image: linear-gradient(transparent, rgba(0,0,0,0.85));
}
.pp-media video::-webkit-media-controls-play-button,
.pp-media video::-webkit-media-controls-volume-slider,
.pp-media video::-webkit-media-controls-timeline,
.pp-media video::-webkit-media-controls-current-time-display,
.pp-media video::-webkit-media-controls-time-remaining-display,
.pp-media video::-webkit-media-controls-mute-button,
.pp-media video::-webkit-media-controls-fullscreen-button {
    filter: brightness(1.2) contrast(1.15);
}

.pp-body { padding: 10px 12px 12px; }
.pp-body .row {
    display: flex; justify-content: space-between; font-size: .72rem;
    padding: 5px 0;
}
.pp-body .row .lbl { color: #94a3b8; }
.pp-body .btnrow { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.pp-body .btnrow a {
    flex: 1; text-align: center; padding: 6px 6px; border-radius: 20px;
    text-decoration: none; font-size: .68rem; font-weight: 700;
    cursor: pointer; border: 0;
    background: rgba(99,102,241,0.25); color: #c7d2fe;
    transition: all .15s; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
}
.pp-body .btnrow a:hover { background: #6366f1; color: #fff; }

/* ============================================================
   TOGGLE BUTTONS
   ============================================================ */
.toggle-wrap {
    position: absolute; top: 220px; right: 12px;
    z-index: 900; display: flex; flex-direction: column; gap: 8px;
    padding: 8px; background: rgba(15,23,42,0.94);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
}
.toggle-btn {
    background: rgba(30,41,59,0.7);
    border: 1px solid rgba(255,255,255,0.08);
    color: #cbd5e1;
    width: 38px; height: 38px; border-radius: 10px;
    font-size: .85rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .18s ease; position: relative; padding: 0;
}
.toggle-btn:hover { background: #1e293b; color: #fff; transform: scale(1.08); }
.toggle-btn.active {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border-color: rgba(139,92,246,0.5); color: #fff;
    box-shadow: 0 4px 12px rgba(99,102,241,0.45);
}
.toggle-btn .tb-label {
    position: absolute; right: calc(100% + 10px);
    top: 50%; transform: translateY(-50%);
    background: rgba(0,0,0,0.92); color: #fff;
    font-size: .7rem; font-weight: 600;
    padding: 5px 10px; border-radius: 6px;
    white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity .18s;
    border: 1px solid rgba(255,255,255,0.1);
}
.toggle-btn:hover .tb-label { opacity: 1; }

/* ============================================================
   RADAR
   ============================================================ */
.radar-controls {
    position: absolute; bottom: 24px; right: 12px; z-index: 900;
    background: rgba(15,23,42,0.94); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    padding: 10px 14px; display: flex; flex-direction: column; gap: 6px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    min-width: 200px;
}
.radar-controls label {
    color: #94a3b8; font-size: .68rem; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
}
.radar-controls label i { color: #a78bfa; }
.radar-controls .val {
    margin-left: auto; color: #00ffcc; font-weight: 700;
    font-family: 'Courier New', monospace; font-size: .72rem;
}
.radar-controls input[type="range"] {
    width: 100%; cursor: pointer;
    accent-color: #6366f1; height: 4px;
}

/* ============================================================
   LEAFLET CONTROLS
   ============================================================ */
.leaflet-control-layers {
    border-radius: 12px !important; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.12) !important;
    background: rgba(15,23,42,0.94) !important;
    backdrop-filter: blur(12px);
    color: #fff !important;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5) !important;
    padding: 0 !important;
}
.leaflet-control-layers-expanded { padding: 10px 14px !important; }
.leaflet-control-layers label {
    color: #cbd5e1 !important; font-weight: 500;
    font-size: .72rem; margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px; cursor: pointer;
}
.leaflet-control-layers label:last-child { margin-bottom: 0; }
.leaflet-control-layers label:hover { color: #fff !important; }
.leaflet-control-layers input[type="radio"] {
    accent-color: #6366f1; margin: 0; cursor: pointer;
}
.leaflet-control-zoom {
    border: none !important; border-radius: 12px !important;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,0.35) !important;
    margin-top: 10px !important; margin-right: 10px !important;
}
.leaflet-control-zoom a {
    background: rgba(15,23,42,0.94) !important;
    backdrop-filter: blur(6px);
    color: #fff !important;
    border: 1px solid rgba(255,255,255,0.1) !important;
    width: 34px !important; height: 34px !important;
    line-height: 32px !important; font-size: 1.05rem !important;
    transition: background .15s;
}
.leaflet-control-zoom a:hover { background: #1e293b !important; }
.leaflet-control-zoom a:first-child { border-bottom: none !important; border-radius: 12px 12px 0 0 !important; }
.leaflet-control-zoom a:last-child { border-radius: 0 0 12px 12px !important; }
</style>
</head>
<body>

<div id="map"></div>

<!-- ============ ★ ปุ่มเปิด Sidebar (แสดงเฉพาะตอนยุบ) ★ ============ -->
<button class="sidebar-reveal-btn" id="sidebarRevealBtn" onclick="toggleSidebar()">
    <i class="fas fa-bars"></i>
    <span class="reveal-tooltip">เปิดแถบด้านซ้าย</span>
</button>

<!-- ============ SIDEBAR ============ -->
<div class="test-sidebar" id="testSidebar">
    <div class="thai-datetime-card">
        <div class="dt-day">
            <i class="fas fa-calendar-check"></i>
            <span id="thai-date">กำลังโหลด...</span>
        </div>
        <div class="dt-time">
            <i class="fas fa-clock"></i>
            <span id="thai-time">00:00:00 น.</span>
        </div>

        <!-- ★ ปุ่มยุบ Sidebar อยู่ขวาบน ★ -->
        <button class="sidebar-collapse-btn" onclick="toggleSidebar()" title="ยุบแถบซ้าย">
            <i class="fas fa-chevron-left"></i>
            <span class="collapse-tooltip">ยุบเก็บ</span>
        </button>

        <!-- ปุ่ม ThaiWater Dashboard -->
        <a class="thaiwater-btn"
           href="https://nakhonsithammarat.thaiwater.net/dashboard"
           target="_blank"
           rel="noopener noreferrer"
           title="ThaiWater Dashboard นครศรีธรรมราช">
            <img src="https://nakhonsithammarat.thaiwater.net/images/logos/nhc.png" alt="ThaiWater">
            <span class="tw-tooltip">💧 ข้อมูลน้ำ นครศรีธรรมราช</span>
        </a>
    </div>

    <div class="sidebar-head">
        <input type="text" id="search" placeholder="🔍 ค้นหาชื่อกล้อง..." oninput="renderList()">
    </div>

    <div class="sidebar-section" id="section-legend">
        <button class="section-head" onclick="toggleSidebarSection('section-legend')">
            <span><i class="fas fa-layer-group"></i> หมวดหมู่กล้อง</span>
            <i class="fas fa-chevron-down section-arrow"></i>
        </button>
        <div class="section-body">
            <div class="legend-list" id="legend-list"></div>
        </div>
    </div>

    <div class="sidebar-section" id="section-water">
        <button class="section-head" onclick="toggleSidebarSection('section-water')">
            <span><i class="fas fa-tint"></i> ระดับน้ำ</span>
            <i class="fas fa-chevron-down section-arrow"></i>
        </button>
        <div class="section-body">
            <div class="legend-list">
                <div class="legend-item" id="nstw-toggle" onclick="nstwToggle()">

/* =========================================================
   DISTRICT BOUNDARIES
   ========================================================= */
const GPX_URL = 'https://raw.githubusercontent.com/72media/my-file/refs/heads/main/23%E0%B8%AD%E0%B8%B3%E0%B9%80%E0%B8%A0%E0%B8%AD%E0%B9%80%E0%B8%A1%E0%B8%B7%E0%B8%AD%E0%B8%87%E0%B8%84%E0%B8%AD%E0%B8%99.gpx';
let districtLayerGroup = null;
let districtPolylines = {};
let districtsVisible = true;

async function loadDistrictBoundaries() {
    try {
        const res = await fetch(GPX_URL);
        const text = await res.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(text, 'application/xml');
        const trks = xml.querySelectorAll('trk');

        districtLayerGroup = L.layerGroup();

        trks.forEach(trk => {
            const nameEl = trk.querySelector('name');
            const districtName = nameEl ? nameEl.textContent.trim() : 'ไม่ทราบชื่อ';

            const points = [];
            trk.querySelectorAll('trkpt').forEach(pt => {
                const lat = parseFloat(pt.getAttribute('lat'));
                const lon = parseFloat(pt.getAttribute('lon'));
                if (!isNaN(lat) && !isNaN(lon)) points.push([lat, lon]);
            });

            if (points.length < 2) return;

            const hue = (districtName.length * 47 + districtName.charCodeAt(0) * 13) % 360;
            const color = `hsl(${hue}, 70%, 55%)`;

            const polyline = L.polyline(points, {
                color: color, weight: 2.5, opacity: 0.85,
                dashArray: '6 4', smoothFactor: 1
            });

            const midPoint = points[Math.floor(points.length / 2)];
            const label = L.marker(midPoint, {
                icon: L.divIcon({
                    className: '',
                    html: `<div style="background:rgba(0,0,0,0.75); color:${color}; font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; border:1px solid ${color}; white-space:nowrap; transform:translate(-50%,-50%); pointer-events:none;">${districtName}</div>`,
                    iconSize: [0, 0], iconAnchor: [0, 0]
                }),
                interactive: false
            });

            districtPolylines[districtName] = polyline;
            districtLayerGroup.addLayer(polyline);
            districtLayerGroup.addLayer(label);
        });

        districtLayerGroup.addTo(map);
        console.log(`✅ โหลดขอบเขตอำเภอสำเร็จ ${trks.length} อำเภอ`);
    } catch (e) {
        console.error('❌ โหลด GPX ไม่สำเร็จ', e);
    }
}

                sandbox="allow-scripts allow-same-origin allow-popups"
                onload="document.getElementById('loader-${uid}').style.display='none';"></iframe>

    }
    return '<div class="pp-media" style="display:flex; align-items:center; justify-content:center; color:#666; font-size:.75rem;">ไม่มีพรีวิว</div>';
}

function buildPopup(cam) {

                <a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${cam.lat},${cam.lng}" target="_blank"><i class="fas fa-street-view"></i> Street</a>

}

/* =========================================================
   HLS
   ========================================================= */
function startHLS(uid, rawUrl) {
    const video = document.getElementById('video-' + uid);
    const loader = document.getElementById('loader-' + uid);
    const errorBox = document.getElementById('error-' + uid);
    if (!video) return;
    stopHLS(uid);

    let cleanUrl = rawUrl;
    let authHeader = null;
    const authMatch = rawUrl.match(/^(https?):\/\/([^:@\/]+):([^@\/]+)@(.+)$/);
    if (authMatch) {
        const [, proto, user, pass, rest] = authMatch;
        cleanUrl = `${proto}://${rest}`;
        try {
            authHeader = 'Basic ' + btoa(decodeURIComponent(user) + ':' + decodeURIComponent(pass));
        } catch (e) {
            authHeader = 'Basic ' + btoa(user + ':' + pass);
        }
    }

    const showError = (msgHtml) => {
        if (loader) loader.style.display = 'none';
        if (errorBox) {
            errorBox.style.display = 'flex';
            const div = errorBox.querySelector('div');
            if (div && msgHtml) div.innerHTML = msgHtml;
        }
    };

    if (window.Hls && Hls.isSupported()) {
        const hls = new Hls({
            enableWorker: true, lowLatencyMode: true, backBufferLength: 90,
            xhrSetup: (xhr) => {
                if (authHeader) {
                    try { xhr.setRequestHeader('Authorization', authHeader); } catch (e) {}
                }
            }
        });
        hls.loadSource(cleanUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            if (loader) loader.style.display = 'none';
            video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (e, data) => {
            if (data.fatal) {
                if (data.response && data.response.code === 401) {
                    showError('🔒 401 Unauthorized<br>Token อาจหมดอายุ<br>กด "เปิดในแท็บใหม่"');
                } else if (data.response && data.response.code === 403) {
                    showError('🚫 403 Forbidden<br>ไม่มีสิทธิ์เข้าถึง');
                } else {
                    const details = data.details || data.type || '';
                    showError(`โหลดสตรีมไม่สำเร็จ<br><small>${details}</small>`);
                }
            }
        });
        hlsPlayers[uid] = hls;
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = rawUrl;
        video.addEventListener('loadedmetadata', () => {
            if (loader) loader.style.display = 'none';
            video.play().catch(() => {});
        }, { once: true });
        video.addEventListener('error', () => showError(), { once: true });
    } else {
        showError('เบราว์เซอร์ไม่รองรับ HLS');
    }
}

function stopHLS(uid) {
    if (hlsPlayers[uid]) {
        try { hlsPlayers[uid].destroy(); } catch (e) {}
        delete hlsPlayers[uid];
    }
    const video = document.getElementById('video-' + uid);
    if (video) { video.pause(); video.removeAttribute('src'); video.load(); }
}

// โหลดภาพล่าสุดทันทีทุกครั้งที่เปิด popup (ใส่ timestamp กัน browser ใช้ภาพแคชเก่า)
function refreshJpgNow(uid, url) {
    const img = document.getElementById('img-' + uid);
    if (!img) return;
    const loader = document.getElementById('loader-' + uid);
    const err = document.getElementById('error-' + uid);
    if (loader) loader.style.display = 'flex';
    if (err) err.style.display = 'none';
    img.style.display = 'block';
    img.src = url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
}

function startJpgRefresh(uid, url) {
    stopJpgRefresh(uid);
    jpgTimers[uid] = setInterval(() => {
        const img = document.getElementById('img-' + uid);
        if (img) {
            img.style.display = 'block';
            img.src = url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
        }
    }, 5000);
}

function stopJpgRefresh(uid) {
    if (jpgTimers[uid]) { clearInterval(jpgTimers[uid]); delete jpgTimers[uid]; }
}

<script>
/**
 * nst-water-stations.js
 * ดึงสถานีวัดระดับน้ำ "เฉพาะจังหวัดนครศรีธรรมราช" ออกมาเป็นชุดข้อมูลสำหรับนำไปใส่แผนที่อื่น
 *
 * แหล่งข้อมูล (เหมือนกับที่ใช้ใน index.html):
 *   1) Thai Water  https://api-v3.thaiwater.net/api/v1/thaiwater30/public/waterlevel_load
 *   2) สสน. (HII)  https://floodwatch.cloud/api/external/water-stations   (เฉพาะ agency = "สสน.")
 * สถานีที่ซ้ำกัน (รหัสหรือพิกัดเดียวกัน) จะเก็บของ Thai Water เพียงอันเดียว
 *
 * วิธีใช้
 *   Browser : (โหลดไฟล์นี้ด้วยแท็ก script)
 *             NSTWater.load().then(stations => { NSTWater.table(stations); });
 *   Leaflet : NSTWater.load().then(st => NSTWater.addToLeaflet(map, st));
 *   Node 18+: node nst-water-stations.js            -> พิมพ์ตารางรายชื่อ
 *             node nst-water-stations.js --geojson > nst.geojson
 *             node nst-water-stations.js --json    > nst.json
 */
(function (root) {
    'use strict';

    const CONFIG = {
        province: 'นครศรีธรรมราช',
        // กรอบพิกัดคร่าว ๆ ของจังหวัด ใช้เป็นตัวสำรองเฉพาะสถานีที่ API ไม่ระบุจังหวัด
        bbox: { south: 7.85, north: 9.10, west: 99.30, east: 100.45 },
        thaiwaterUrl: 'https://api-v3.thaiwater.net/api/v1/thaiwater30/public/waterlevel_load',
        hiiUrl: 'https://floodwatch.cloud/api/external/water-stations',
        proxy: u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u) // ใช้เมื่อติด CORS
    };

    const SITUATION = {
        1: { color: '#a35709', label: 'น้ำน้อยวิกฤต' },
        2: { color: '#f39c12', label: 'น้ำน้อย' },
        3: { color: '#2ea043', label: 'ปกติ' },
        4: { color: '#1e6fd9', label: 'น้ำมาก' },
        5: { color: '#e53935', label: 'ล้นตลิ่ง' }
    };
    const UNKNOWN = { color: '#8b949e', label: 'ไม่มีข้อมูลสถานะ' };

    async function fetchJson(url) {
        try {
            const r = await fetch(url);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return await r.json();
        } catch (e) {
            const r2 = await fetch(CONFIG.proxy(url));
            if (!r2.ok) throw new Error('HTTP ' + r2.status + ' (proxy) — ' + url);
            return r2.json();
        }
    }

    const clean = s => String(s || '').replace(/^จ\.\s*/, '').replace(/^จังหวัด\s*/, '').trim();

    function inBBox(lat, lng) {
        const b = CONFIG.bbox;
        return lat >= b.south && lat <= b.north && lng >= b.west && lng <= b.east;
    }

    // แปลง record ของ API ให้เป็นโครงสร้างแบน ๆ ใช้ง่าย
    function normalize(st, source) {
        const lat = parseFloat(st.station?.tele_station_lat);
        const lng = parseFloat(st.station?.tele_station_long);
        if (isNaN(lat) || isNaN(lng)) return null;

        const province = clean(st.geocode?.province_name?.th);
        let matchedBy;
        if (province) {
            if (province !== CONFIG.province) return null;
            matchedBy = 'province';
        } else if (inBBox(lat, lng)) {
            matchedBy = 'bbox'; // API ไม่ระบุจังหวัด แต่พิกัดอยู่ในกรอบจังหวัด
        } else {
            return null;
        }

        const wl = st.waterlevel_msl != null ? parseFloat(st.waterlevel_msl) : null;
        const prev = st.waterlevel_msl_previous != null ? parseFloat(st.waterlevel_msl_previous) : null;
        let trend = 'ทรงตัว';
        if (wl != null && prev != null) {
            const d = wl - prev;
            if (d > 0.01) trend = 'ขึ้น'; else if (d < -0.01) trend = 'ลด';
        }
        const sit = SITUATION[st.situation_level] || UNKNOWN;

        return {
            id: st.station?.tele_station_oldcode || null,
            name: st.station?.tele_station_name?.th || st.station?.tele_station_name?.en || st.station?.tele_station_oldcode || '-',
            name_en: st.station?.tele_station_name?.en || '',
            lat, lng,
            amphoe: st.geocode?.amphoe_name?.th || '',
            province: province || CONFIG.province,
            agency: st.agency?.agency_shortname?.th || '-',
            river: st.river_name || '',
            water_level_msl: wl,            // ม.รทก.
            water_level_prev: prev,
            trend,
            bank_diff: st.diff_wl_bank != null ? parseFloat(st.diff_wl_bank) : null,
            bank_text: st.diff_wl_bank_text || '',
            storage_percent: st.storage_percent != null ? st.storage_percent : null,
            situation_level: st.situation_level ?? null,
            situation: sit.label,
            color: sit.color,
            datetime: st.waterlevel_datetime || '',
            source,                         // 'thaiwater' | 'hii'
            matchedBy
        };
    }

    const keysOf = s => {
        const k = [];
        if (s.id) k.push('code:' + String(s.id).trim());
        k.push('pos:' + s.lat.toFixed(4) + ',' + s.lng.toFixed(4));
        return k;
    };

    // รวมสองแหล่ง ตัดซ้ำ (Thai Water มาก่อน)
    function buildList(thaiwaterPayload, hiiPayload) {
        const out = [];
        const seen = new Set();
        const add = (rows, source, agencyOnly) => {
            (rows || []).forEach(raw => {
                if (agencyOnly && (raw.agency?.agency_shortname?.th || '').trim() !== agencyOnly) return;
                const s = normalize(raw, source);
                if (!s) return;
                const ks = keysOf(s);
                if (ks.some(k => seen.has(k))) return;
                ks.forEach(k => seen.add(k));
                out.push(s);
            });
        };
        add(thaiwaterPayload?.waterlevel_data?.data, 'thaiwater');
        add(hiiPayload?.waterlevel_data?.data, 'hii', 'สสน.');
        return out.sort((a, b) =>
            a.amphoe.localeCompare(b.amphoe, 'th') || a.name.localeCompare(b.name, 'th'));
    }

    async function load() {
        const [tw, hii] = await Promise.allSettled([
            fetchJson(CONFIG.thaiwaterUrl), fetchJson(CONFIG.hiiUrl)
        ]);
        if (tw.status === 'rejected') console.warn('โหลด Thai Water ไม่สำเร็จ:', tw.reason);
        if (hii.status === 'rejected') console.warn('โหลด สสน. ไม่สำเร็จ:', hii.reason);
        if (tw.status === 'rejected' && hii.status === 'rejected') throw new Error('โหลดข้อมูลไม่สำเร็จทั้งสองแหล่ง');
        return buildList(tw.value, hii.value);
    }

    function toGeoJSON(stations) {
        return {
            type: 'FeatureCollection',
            features: stations.map(s => {
                const { lat, lng, ...props } = s;
                return { type: 'Feature', geometry: { type: 'Point', coordinates: [lng, lat] }, properties: props };
            })
        };
    }

    // พิมพ์รายชื่อว่ามีที่ไหนบ้าง จัดกลุ่มตามอำเภอ
    function table(stations) {
        const byAmphoe = {};
        stations.forEach(s => (byAmphoe[s.amphoe || '(ไม่ระบุอำเภอ)'] ||= []).push(s));
        console.log('สถานีวัดระดับน้ำ จ.' + CONFIG.province + ' ทั้งหมด ' + stations.length + ' สถานี');
        Object.keys(byAmphoe).forEach(a => {
            console.log('\nอ.' + a + ' (' + byAmphoe[a].length + ')');
            console.table(byAmphoe[a].map(s => ({
                สถานี: s.name, แม่น้ำ: s.river, หน่วยงาน: s.agency,
                'ระดับน้ำ(ม.รทก.)': s.water_level_msl, แนวโน้ม: s.trend,
                สถานการณ์: s.situation, lat: s.lat, lng: s.lng, เวลา: s.datetime
            })));
        });
        return byAmphoe;
    }

    // ---------- การ์ด popup + หมุด (หน้าตาเดียวกับหน้า Thai Water เดิม) ----------
    const CARD_CSS = `
.nstw-dot{background:transparent;border:none}
.nstw-dot-inner{width:100%;height:100%;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.nstw-dot:hover .nstw-dot-inner{transform:scale(1.4);box-shadow:0 3px 10px rgba(0,0,0,.6)}
.nstw-popup .leaflet-popup-content-wrapper{padding:0;overflow:hidden;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.38);width:240px!important;max-width:240px!important;min-width:240px!important;background:#fff;color:#181818}
.nstw-popup .leaflet-popup-content{margin:0!important;width:240px!important;max-width:240px!important;min-width:240px!important}
.nstw-popup .leaflet-popup-tip{background:#fff}
.nstw-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;background:#f5f6f8;border-radius:14px;padding:10px 12px 9px}
.nstw-hero-label{display:flex;align-items:center;gap:5px;font-size:.64rem;font-weight:800;color:#6b7280;letter-spacing:.2px;text-transform:uppercase}
.nstw-hero-num{font-size:2rem;font-weight:900;color:#181818;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.nstw-hero-unit{font-size:.68rem;font-weight:800;color:#9aa0a6;margin-left:3px}

.nstw-mini-label{display:flex;align-items:center;gap:5px;font-size:.63rem;font-weight:800;color:#6b7280}
.nstw-mini-label i{font-size:.58rem;width:11px;text-align:center;opacity:.85}
.nstw-mini-val{font-size:.92rem;font-weight:800;color:#181818;font-variant-numeric:tabular-nums}
.nstw-mini-unit{font-size:.58rem;font-weight:700;color:#9aa0a6;margin-left:2px}`;

    function injectStyles() {
        if (typeof document === 'undefined' || document.getElementById('nstw-style')) return;
        const el = document.createElement('style');
        el.id = 'nstw-style';
        el.textContent = CARD_CSS;
        document.head.appendChild(el);
    }

    const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function popupHTML(s) {
        const c = s.color;
        const trendIcon = s.trend === 'ขึ้น' ? '🔺' : s.trend === 'ลด' ? '🔻' : '🟢';
        const overflow = /ล้นตลิ่ง/.test(s.bank_text);
        const bankColor = overflow ? '#e53935' : '#2e7d32';
        const loc = esc(s.amphoe) + (s.amphoe && s.province ? ', ' : '') + esc(s.province);
        return `
<div style="width:100%;font-family:inherit;">
  <div style="background:linear-gradient(135deg,${c},${c}cc 60%,${c}90);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;">
    <div style="width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <i class="fas fa-water" style="font-size:.7rem;"></i>
    </div>
    <div style="min-width:0;">
      <div style="font-size:.78rem;font-weight:800;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${esc(s.name)}</div>
      <div style="font-size:.6rem;font-weight:700;opacity:.9;margin-top:1px;">${esc(s.agency)} · ${loc}</div>
    </div>
  </div>
  <div style="padding:10px 11px 11px;">
    <div class="nstw-hero">
      <div>
        <div class="nstw-hero-label"><i class="fas fa-ruler-vertical"></i> ระดับน้ำ</div>
        <div><span class="nstw-hero-num">${s.water_level_msl != null ? s.water_level_msl : '-'}</span><span class="nstw-hero-unit">ม.รทก.</span></div>
      </div>
      <span style="background:${c};color:#fff;font-size:.62rem;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap;">${esc(s.situation)}</span>
    </div>
    <div class="nstw-mini">
      <span class="nstw-mini-label">${trendIcon} แนวโน้ม${esc(s.trend)}</span>
      <span><span class="nstw-mini-val" style="font-size:.8rem;">${s.water_level_prev != null ? s.water_level_prev : '-'}</span><span class="nstw-mini-unit">ม. (ค่าก่อนหน้า)</span></span>
    </div>
    ${s.storage_percent != null ? `
    <div class="nstw-mini">
      <span class="nstw-mini-label"><i class="fas fa-percent"></i> % ความจุ/ระดับ</span>
      <span><span class="nstw-mini-val">${esc(s.storage_percent)}</span><span class="nstw-mini-unit">%</span></span>
    </div>` : ''}
    <div class="nstw-mini" style="background:${overflow ? '#fdeaea' : '#eaf6ec'};">
      <span class="nstw-mini-label" style="color:${bankColor};"><i class="fas ${overflow ? 'fa-triangle-exclamation' : 'fa-circle-check'}"></i> ${esc(s.bank_text || '-')}</span>
      <span><span class="nstw-mini-val" style="color:${bankColor};">${s.bank_diff != null ? s.bank_diff : '-'}</span><span class="nstw-mini-unit">ม.</span></span>
    </div>
    ${s.river ? `<div style="font-size:.6rem;color:#9aa0a6;font-weight:700;margin-top:6px;"><i class="fas fa-water"></i> แม่น้ำ/ลำน้ำ: ${esc(s.river)}</div>` : ''}
    ${s.name_en ? `<div style="font-size:.58rem;color:#9aa0a6;font-weight:700;margin-top:3px;">${esc(s.name_en)}</div>` : ''}
    <div style="font-size:.58rem;color:#9aa0a6;font-weight:700;margin-top:5px;"><i class="far fa-clock"></i> ${esc(s.datetime || '-')} น.</div>
  </div>
</div>`;
    }

    // วางหมุดบนแผนที่ Leaflet ของคุณ (ต้องโหลด Leaflet ก่อน; การ์ดใช้ไอคอนของ Font Awesome ถ้ามี)
    function addToLeaflet(map, stations, opts) {
        const L = root.L;
        if (!L) throw new Error('ไม่พบ Leaflet (L)');
        injectStyles();
        const size = (opts && opts.size) || 16;
        const group = L.layerGroup();
        stations.forEach(s => {
            const icon = L.divIcon({
                className: 'nstw-dot',
                html: '<div class="nstw-dot-inner" style="background:' + s.color + ';"></div>',
                iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -(size / 2) - 4]
            });
            L.marker([s.lat, s.lng], { icon })
                .bindPopup(popupHTML(s), { minWidth: 250, maxWidth: 250, className: 'nstw-popup' })
                .addTo(group);
        });
        group.addTo(map);
        return group;
    }

    // ดาวน์โหลดไฟล์ (เฉพาะ browser)
    function download(filename, text, type) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([text], { type: type || 'application/json' }));
        a.download = filename; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    const api = {
        CONFIG, load, buildList, normalize, toGeoJSON, table, addToLeaflet, popupHTML,
        downloadGeoJSON: st => download('nst-water-stations.geojson', JSON.stringify(toGeoJSON(st), null, 2)),
        downloadJSON: st => download('nst-water-stations.json', JSON.stringify(st, null, 2))
    };
    root.NSTWater = api;
    if (typeof module !== 'undefined' && module.exports) module.exports = api;

    // CLI (Node)
    if (typeof require !== 'undefined' && typeof module !== 'undefined' && require.main === module) {
        load().then(st => {
            if (process.argv.includes('--geojson')) console.log(JSON.stringify(toGeoJSON(st), null, 2));
            else if (process.argv.includes('--json')) console.log(JSON.stringify(st, null, 2));
            else table(st);
        }).catch(e => { console.error(e.message); process.exit(1); });
    }
})(typeof window !== 'undefined' ? window : globalThis);


/* ---- ชั้นระดับน้ำ: ผูกกับแผนที่ (map) ของหน้านี้ ---- */
let nstwGroup = null, nstwOn = true, nstwTimer = null;

async function nstwRefresh() {
    const statusEl = document.getElementById('nstw-status');
    const cntEl = document.getElementById('nstw-count');
    try {
        const stations = await NSTWater.load();
        if (nstwGroup) map.removeLayer(nstwGroup);
        nstwGroup = NSTWater.addToLeaflet(map, stations);
        if (!nstwOn) map.removeLayer(nstwGroup);
        cntEl.textContent = stations.length;
        const t = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', hour12: false });
        statusEl.textContent = stations.length ? 'อัปเดต ' + t + ' น.' : 'ไม่พบสถานีในจังหวัด';
    } catch (e) {
        console.warn('โหลดระดับน้ำไม่สำเร็จ', e);
        statusEl.textContent = 'โหลดข้อมูลระดับน้ำไม่สำเร็จ';
        cntEl.textContent = '–';
    }
}

window.nstwToggle = function () {
    nstwOn = !nstwOn;
    document.getElementById('nstw-toggle').classList.toggle('off', !nstwOn);
    if (!nstwGroup) return;
    if (nstwOn) nstwGroup.addTo(map); else map.removeLayer(nstwGroup);
};

nstwRefresh();
nstwTimer = setInterval(nstwRefresh, 5 * 60 * 1000);
</script>
</body>
</html>
